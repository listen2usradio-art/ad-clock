<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heat 91.7 FM – Ad Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #000;
  color: #00ff66;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
  padding: 20px;
}

.logo {
  max-width: 180px;
  margin-bottom: 15px;
}

h1 {
  color: #ffd700;
  font-size: 32px;
}

.time {
  font-size: 42px;
  margin: 20px 0;
}

.label {
  color: #fff;
  font-size: 20px;
}

.countdown {
  font-size: 60px;
  margin-top: 15px;
}

.warning {
  color: red;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}
</style>
</head>

<body>

<img src="heat-logo.png" class="logo" alt="Heat 91.7 FM">

<h1>HEAT 91.7 FM – AD CLOCK</h1>

<div class="label">Current Time (ET)</div>
<div class="time" id="currentTime"></div>

<div class="label">Next Ad Break</div>
<div class="time" id="nextAd"></div>

<div class="label">ADS IN</div>
<div class="countdown" id="countdown"></div>

<script>
function updateClock() {
  const now = new Date(
    new Date().toLocaleString("en-US", { timeZone: "America/New_York" })
  );

  const minutes = now.getMinutes();
  const seconds = now.getSeconds();

  // CHANGE THIS IF ADS ARE NOT HOURLY
  const nextAd = new Date(now);
  nextAd.setMinutes(60, 0, 0);

  const diff = Math.max(0, nextAd - now);

  const mins = Math.floor(diff / 60000);
  const secs = Math.floor((diff % 60000) / 1000);

  document.getElementById("currentTime").innerHTML =
    now.toLocaleTimeString();

  document.getElementById("nextAd").innerHTML =
    nextAd.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  const cd = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  const countdownEl = document.getElementById("countdown");

  countdownEl.innerHTML = cd;

  if (mins === 0 && secs <= 30) {
    countdownEl.classList.add("warning");
  } else {
    countdownEl.classList.remove("warning");
  }
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
